server {
    listen 80 default_server;
    root /var/www/board;
    access_log /var/log/nginx/board.access.log;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 8080 default_server;
    root /var/www/debug;
    access_log /var/log/nginx/debug.access.log;
    location / { try_files $uri $uri/ =404; }
}
