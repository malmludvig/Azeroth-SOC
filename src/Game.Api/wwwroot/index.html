<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The gate</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    html, body { height: 100%; margin: 0; background: #11140f; color: #d7dccf; font: 14px/1.4 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 16px; align-items: baseline; padding: 8px 14px; border-bottom: 1px solid #2b3126; }
    header strong { letter-spacing: 0.04em; }
    #status { color: #9aa38c; }
    #status.bad { color: #e0a060; }
    #terminal { flex: 1; min-height: 0; padding: 8px 6px 6px 10px; }
  </style>
</head>
<body>
  <header>
    <strong>The gate</strong>
    <span id="status">Connecting...</span>
  </header>
  <div id="terminal"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script>
    const status = document.getElementById('status');
    const say = (text, bad) => { status.textContent = text; status.className = bad ? 'bad' : ''; };

    const term = new Terminal({
      cursorBlink: true,
      fontFamily: 'ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace',
      fontSize: 14,
      scrollback: 5000,
      theme: { background: '#11140f', foreground: '#d7dccf', cursor: '#d7dccf' },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('terminal'));
    fit.fit();

    const encoder = new TextEncoder();
    let socket = null;
    let retry = 0;

    const sendSize = () => {
      if (socket && socket.readyState === WebSocket.OPEN)
        socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };

    term.onData(data => {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(encoder.encode(data));
    });
    term.onResize(sendSize);
    window.addEventListener('resize', () => fit.fit());

    async function connect() {
      let state;
      try {
        state = await (await fetch('api/status')).json();
      } catch {
        say('The game is not answering. Retrying...', true);
        return again();
      }
      if (!state.running) {
        say(state.error ? 'Docker is not answering. Retrying...' : 'No lab is running. Start one with: Game.Cli play', true);
        return again();
      }

      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${scheme}://${location.host}/terminal`);
      socket.binaryType = 'arraybuffer';
      socket.onopen = () => {
        retry = 0;
        // The server replays what was on screen, so start from a clean one.
        term.reset();
        say(`Run ${state.runId}. Type: quest`);
        sendSize();
        term.focus();
      };
      socket.onmessage = event => term.write(new Uint8Array(event.data));
      socket.onclose = () => {
        say('Disconnected. Reconnecting...', true);
        again();
      };
    }

    function again() {
      retry = Math.min(retry + 1, 5);
      setTimeout(connect, retry * 1000);
    }

    connect();
  </script>
</body>
</html>
